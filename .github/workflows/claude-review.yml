name: Claude Code Review

# Runs an AI code review on every pull request. Uses pull_request (not
# pull_request_target) so PRs from forks never receive repository secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            You are reviewing a pull request to this repository.
            Read REVIEW.md in the repository root first and follow it exactly.

            - Get the PR description and existing comments with `gh pr view --comments`,
              and the diff with `gh pr diff`.
            - If EVENT is "synchronize", this is a re-review: follow the re-review rules in REVIEW.md.
            - Finish both passes (find, then verify) before posting anything.
            - Post each verified finding as an inline comment with
              mcp__github_inline_comment__create_inline_comment.
            - Post the summary comment once with `gh pr comment`.
            - Never approve the pull request.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
